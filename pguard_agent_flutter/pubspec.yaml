name: pguard_agent
description: "PGuard Activity Monitoring Agent for Windows/macOS/Linux"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Core dependencies
  http: ^1.2.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  ffi: ^2.1.0
  win32: ^5.2.0
  win32_registry: ^1.1.0
  system_tray: ^2.0.0
  window_manager: ^0.4.0
  flutter_background_service: ^5.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  logging: ^1.2.0
  crypto: ^3.0.3
  collection: ^1.18.0
  sqflite_common_ffi: ^2.0.0

# App icon generation
flutter_launcher_icons:
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  image_path: "assets/icons/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^15.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/